name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          for /f %%i in ('python -c "import qfluentwidgets,os;print(os.path.dirname(qfluentwidgets.__file__))"') do set QFW=%%i
          pyinstaller --onefile --windowed --name "jiaxing-find-people" --icon client/icon.ico --add-data "client/icon.ico;." --add-data "%QFW%;qfluentwidgets" --hidden-import PyQt5.sip --hidden-import PyQt5.QtWidgets --hidden-import PyQt5.QtGui --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtSvg --hidden-import qfluentwidgets --hidden-import qfluentwidgets.common --hidden-import qfluentwidgets.components --hidden-import qfluentwidgets.window client/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiaxing-find-people
          path: dist/jiaxing-find-people.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jiaxing-find-people
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jiaxing-find-people.exe
          generate_release_notes: true
